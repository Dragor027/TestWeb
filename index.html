<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casse-brique simple</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    #game {
      background: #000;
      border: 2px solid #fff;
      display: block;
    }
    .info {
      text-align: center;
      margin-top: 12px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div>
    <canvas id="game" width="480" height="320"></canvas>
    <div class="info">Flèches gauche/droite pour bouger • Casse toutes les briques !</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const paddle = {
      width: 80,
      height: 10,
      x: (canvas.width - 80) / 2,
      speed: 6,
      movingLeft: false,
      movingRight: false
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 30,
      radius: 8,
      dx: 3,
      dy: -3
    };

    const brickConfig = {
      rows: 5,
      cols: 8,
      width: 50,
      height: 16,
      padding: 8,
      offsetTop: 30,
      offsetLeft: 24
    };

    const bricks = [];
    for (let c = 0; c < brickConfig.cols; c++) {
      bricks[c] = [];
      for (let r = 0; r < brickConfig.rows; r++) {
        bricks[c][r] = { x: 0, y: 0, alive: true };
      }
    }

    let score = 0;
    let gameOver = false;
    let won = false;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') paddle.movingLeft = true;
      if (e.key === 'ArrowRight') paddle.movingRight = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft') paddle.movingLeft = false;
      if (e.key === 'ArrowRight') paddle.movingRight = false;
    });

    function drawPaddle() {
      ctx.fillStyle = '#4cc9f0';
      ctx.fillRect(paddle.x, canvas.height - paddle.height - 8, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#f72585';
      ctx.fill();
      ctx.closePath();
    }

    function drawBricks() {
      for (let c = 0; c < brickConfig.cols; c++) {
        for (let r = 0; r < brickConfig.rows; r++) {
          const b = bricks[c][r];
          if (!b.alive) continue;
          const brickX = c * (brickConfig.width + brickConfig.padding) + brickConfig.offsetLeft;
          const brickY = r * (brickConfig.height + brickConfig.padding) + brickConfig.offsetTop;
          b.x = brickX;
          b.y = brickY;
          ctx.fillStyle = '#90be6d';
          ctx.fillRect(brickX, brickY, brickConfig.width, brickConfig.height);
        }
      }
    }

    function drawScore() {
      ctx.font = '16px Arial';
      ctx.fillStyle = '#fff';
      ctx.fillText(`Score : ${score}`, 8, 20);
    }

    function collisionDetection() {
      for (let c = 0; c < brickConfig.cols; c++) {
        for (let r = 0; r < brickConfig.rows; r++) {
          const b = bricks[c][r];
          if (!b.alive) continue;

          if (
            ball.x > b.x &&
            ball.x < b.x + brickConfig.width &&
            ball.y > b.y &&
            ball.y < b.y + brickConfig.height
          ) {
            ball.dy = -ball.dy;
            b.alive = false;
            score++;

            if (score === brickConfig.rows * brickConfig.cols) {
              won = true;
              gameOver = true;
            }
          }
        }
      }
    }

    function update() {
      if (paddle.movingLeft) paddle.x -= paddle.speed;
      if (paddle.movingRight) paddle.x += paddle.speed;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) ball.dx = -ball.dx;
      if (ball.y - ball.radius < 0) ball.dy = -ball.dy;

      const paddleTop = canvas.height - paddle.height - 8;
      if (
        ball.y + ball.radius >= paddleTop &&
        ball.y + ball.radius <= paddleTop + paddle.height &&
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.width
      ) {
        ball.dy = -Math.abs(ball.dy);
      }

      if (ball.y + ball.radius > canvas.height) {
        gameOver = true;
      }

      collisionDetection();
    }

    function drawEndScreen() {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '28px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(won ? 'Gagné !' : 'Perdu !', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '18px Arial';
      ctx.fillText('Recharge la page pour rejouer', canvas.width / 2, canvas.height / 2 + 24);
      ctx.textAlign = 'start';
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawPaddle();
      drawBall();
      drawScore();

      if (!gameOver) {
        update();
        requestAnimationFrame(loop);
      } else {
        drawEndScreen();
      }
    }

    loop();
  </script>
</body>
</html>
